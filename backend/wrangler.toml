name = "tcm-clinic-api"
main = "src/worker/index.js"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "tcm.jingguohua.cc.cd"
custom_domain = true

[vars]
NODE_ENV = "production"
JWT_SECRET = "tcm-clinic-jwt-secret-change-in-production"
JWT_EXPIRES_IN = "7d"
CORS_ORIGIN = "*"
ADMIN_LOGIN_PHONE = "13800000000"
ADMIN_LOGIN_PASSWORD = "admin123"
