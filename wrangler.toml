name = "tcm-clinic-api"
main = "backend/preview/index.js"
compatibility_date = "2026-07-29"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "AppContainer"
image = "./Dockerfile"
max_instances = 3

[durable_objects]
bindings = [
  { class_name = "AppContainer", name = "TCM_API" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppContainer"]
